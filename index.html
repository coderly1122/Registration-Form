<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #033f2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        form {
            background: rgb(79, 170, 147);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 420px;
        }

        h1 {
            text-align: center;
            color: rgb(126, 18, 4);
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            color: #051d1d;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid black;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: rgb(5, 29, 29);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .error-msg {
            color: #b30000;
            font-size: 13px;
            font-weight: bold;
            display: block;
            min-height: 18px;
            margin-bottom: 8px;
        }

        /* Success Message Container - Hidden by default */
        #success-container {
            display: none;
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: popIn 0.5s ease;
        }

        #success-container h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
    <script>
        function submitForm(event) {
            event.preventDefault(); // Stop page reload

            // 1. Reset Errors
            let errorSpans = document.getElementsByClassName("error-msg");
            for (let span of errorSpans) { span.innerHTML = ""; }

            // 2. Get values
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let city = document.getElementById("city").value;
            let gender = document.querySelector('input[name="gender"]:checked');
            let hobbies = document.querySelectorAll('input[name="hobby"]:checked');
            
            let isvalid = true;

            // 3. Validation logic
            if (name.trim() === "") {
                document.getElementById("nameError").innerHTML = "Name is required";
                isvalid = false;
            }
            if (!email.includes("@")) {
                document.getElementById("emailError").innerHTML = "Enter a valid email";
                isvalid = false;
            }
            if (password.length < 6) {
                document.getElementById("passwordError").innerHTML = "Min 6 characters required";
                isvalid = false;
            }
            if (city === "default") {
                document.getElementById("cityError").innerHTML = "Select a city";
                isvalid = false;
            }
            if (!gender) {
                document.getElementById("genderError").innerHTML = "Select a gender";
                isvalid = false;
            }
            if (hobbies.length === 0) {
                document.getElementById("hobbyError").innerHTML = "Select at least one hobby";
                isvalid = false;
            }

            // 4. Final Action
            if (isvalid) {
                // HIDE the form
                document.getElementById("registrationForm").style.display = "none";
                
                // SHOW the success container
                document.getElementById("success-container").style.display = "block";
            }
            
            return false;
        }
    </script>
</head>
<body>

    <form id="registrationForm" onsubmit="return submitForm(event)">
        <h1>Registration Form</h1>
        
        <label>Name:</label>
        <input type="text" id="name">
        <span id="nameError" class="error-msg"></span>

        <label>Email:</label>
        <input type="email" id="email">
        <span id="emailError" class="error-msg"></span>

        <label>Password:</label>
        <input type="password" id="password">
        <span id="passwordError" class="error-msg"></span>

        <label>City:</label>
        <select id="city">
            <option value="default">-- Choose City --</option>
            <option value="new-york">New York</option>
            <option value="london">London</option>
        </select>
        <span id="cityError" class="error-msg"></span>

        <p><strong>Gender:</strong></p>
        <input type="radio" name="gender" value="male"> Male <br>
        <input type="radio" name="gender" value="female"> Female <br>
        <input type="radio" name="gender" value="female"> other <br>
        <span id="genderError" class="error-msg"></span>

        <p><strong>Hobbies:</strong></p>
        <input type="checkbox" name="hobby" value="coding"> Coding <br>
        <input type="checkbox" name="hobby" value="music"> Music <br>
        <input type="checkbox" name="hobby" value="sports"> sports <br>
        <input type="checkbox" name="hobby" value="reading"> reading <br>
        <span id="hobbyError" class="error-msg"></span>

        <button type="submit">Submit Form</button>
    </form>

    <div id="success-container">
        <h2>Success! ✅</h2>
        <p>Your form has been submitted successfully.</p>
        <button onclick="window.location.reload()" style="background: #033f2b; margin-top: 10px;">Go Back</button>
    </div>

</body>
</html>
