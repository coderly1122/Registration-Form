<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #033f2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        form {
            background: rgb(79, 170, 147);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 420px;
        }

        h1 {
            text-align: center;
            color: rgb(126, 18, 4);
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            color: #051d1d;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid black;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: rgb(5, 29, 29);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        /* Faded state when disabled */
        button:disabled {
            background-color: #444;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            color: #b30000;
            font-size: 12px;
            font-weight: bold;
            display: block;
            min-height: 18px;
            margin-bottom: 10px;
        }

        #success-container {
            display: none;
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <form id="registrationForm" onsubmit="return submitForm(event)">
        <h1>Registration Form</h1>
        
        <label>Name:</label>
        <input type="text" id="name" placeholder="3 characters" oninput="validateForm()">
        <span id="nameError" class="error-msg"></span>

        <label>Email:</label>
        <input type="email" id="email" placeholder="example@mail.com" oninput="validateForm()">
        <span id="emailError" class="error-msg"></span>

        <label>Password:</label>
        <input type="password" id="password" placeholder="e.g. abc1234!" oninput="validateForm()">
        <span id="passwordError" class="error-msg"></span>

        <label>City:</label>
        <select id="city" onchange="validateForm()">
            <option value="default">-- Choose City --</option>
            <option value="new-york">New York</option>
            <option value="london">London</option>
        </select>
        <span id="cityError" class="error-msg"></span>

        <p><strong>Gender:</strong></p>
        <input type="radio" name="gender" value="male" onchange="validateForm()"> Male 
        <input type="radio" name="gender" value="female" onchange="validateForm()"> Female 
        <span id="genderError" class="error-msg"></span>

        <p><strong>Hobbies:</strong></p>
        <input type="checkbox" name="hobby" value="coding" onchange="validateForm()"> Coding 
        <input type="checkbox" name="hobby" value="music" onchange="validateForm()"> Music 
        <span id="hobbyError" class="error-msg"></span>

        <button type="submit" id="submitBtn" disabled>Submit Form</button>
    </form>

    <div id="success-container">
        <h2>Success! ✅</h2>
        <p>Your form has been submitted successfully.</p>
        <button onclick="window.location.reload()" style="background: #033f2b;">Go Back</button>
    </div>
<script>
    function validateForm() {
    // Get Elements
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const city = document.getElementById("city").value;
    const gender = document.querySelector('input[name="gender"]:checked');
    const hobbies = document.querySelectorAll('input[name="hobby"]:checked');
    const submitBtn = document.getElementById("submitBtn");

    // Flags
    let isNameValid = false;
    let isEmailValid = false;
    let isPassValid = false;

    // 1. Name Validation - Only shows error if not empty
    if (name.length === 0) {
        document.getElementById("nameError").innerText = ""; // Keep quiet until they type
    } else if (name.length !== 3) {
        document.getElementById("nameError").innerText = "Name must be exactly 3 characters";
    } else {
        document.getElementById("nameError").innerText = "";
        isNameValid = true;
    }

    // 2. Email Validation - Only shows error if user started typing
    if (email.length > 0) {
        if (email.includes("@") && email.endsWith(".com")) {
            document.getElementById("emailError").innerText = "";
            isEmailValid = true;
        } else {
            document.getElementById("emailError").innerText = "Must contain @ and end with .com";
        }
    } else {
        document.getElementById("emailError").innerText = "";
    }

    // 3. Password Validation
    if (password.length > 0) {
        const alphas = (password.match(/[a-zA-Z]/g) || []).length;
        const ints = (password.match(/[0-9]/g) || []).length;
        const specials = (password.match(/[^a-zA-Z0-9]/g) || []).length;

        if (password.length === 8 && alphas === 3 && ints === 4 && specials === 1) {
            document.getElementById("passwordError").innerText = "";
            isPassValid = true;
        } else {
            document.getElementById("passwordError").innerText = "Required: 3 letters, 4 numbers, 1 special (8 total)";
        }
    } else {
        document.getElementById("passwordError").innerText = "";
    }

    // 4. Other Fields Logic
    const isCityValid = city !== "default";
    const isGenderValid = !!gender;
    const isHobbyValid = hobbies.length > 0;

    // We only show these errors if the user has touched them 
    // or if the name/email/pass are already filled out.
    document.getElementById("cityError").innerText = (city === "default" && name.length > 0) ? "" : (isCityValid ? "" : "Please select a city");
    
    // Better yet: Just clear these errors until the button logic needs them
    // or keep them empty until they are interacted with.
    if (isCityValid) document.getElementById("cityError").innerText = "";
    if (isGenderValid) document.getElementById("genderError").innerText = "";
    if (isHobbyValid) document.getElementById("hobbyError").innerText = "";

    // Toggle Submit Button
    if (isNameValid && isEmailValid && isPassValid && isCityValid && isGenderValid && isHobbyValid) {
        submitBtn.disabled = false;
    } else {
        submitBtn.disabled = true;
    }
    
}
</script>
</html>
