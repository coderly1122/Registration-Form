<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body{
            font-family:'Segoe UI' , Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh ;
            margin: 0;
        }
        form
        {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 420px ;
        }
        h1{
            text-align: center;
            color:rgb(126, 18, 4) ;
            margin-bottom: 25px;
        }
        .input-group{
        margin-bottom: 20px;
        }
        label{
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: blue;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"]{
            width: 100%;
            padding: 12px;
            border: 1.5px solid black;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box ;
            transition: all 0.2s;
        }
        input:focus{
            border-color: black;
            outline: none;
            box-shadow: 0 0 0 2px rgb(39, 28, 28);
        }
        .gender-section{
            margin: 20px 0;
        }
        .gender-options{
            display: flex;
            gap: 20px;
            margin-top: 5px;
            color: rgb(43, 11, 11);
            font-size: 15px;
        }
        
        .gender-options label{
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;

        }
        button{
            width:100% ;
            padding: 14px;
            background-color: rgb(238, 18, 18);
            color: #f4f7f6;
            border: none;
            border-radius: 8px ;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            
        }
        button:hover{
            background-color: #0056b3;
        }
        .error-msg{
            color:red;
            font-size: small;
            margin-top: 5px;
            display: block;
        }
    </style>
    <script>
        function submitForm()
        {
            let errorSpans = document.getElementsByClassName("error-msg");
            for (let span of errorSpans) {
                span.innerHTML = "";}
            let name= document.getElementById("name").value;
            let email= document.getElementById("email").value;
            let password= document.getElementById("password").value;
            let city= document.getElementById("city").value;
            let gender = document.querySelector('input[name="gender"]:checked');
            let hobbies = document.querySelectorAll('input[name="hobby"]:checked');
            let isvalid=true;
          if(name==""){
            document.getElementById("nameError").innerHTML ="Name is required";
            isvalid=false;
          }
          if(!email.includes("@")){
            document.getElementById("emailError").innerHTML ="Enter a valid email";
            isvalid=false;
          }
          if(password.length < 6){
            document.getElementById("passwordError").innerHTML ="Password must be atleast 6 characters";
            isvalid=false;
        }
          if(city=="default"){
            document.getElementById("cityError").innerHTML ="Select a city";
             isvalid=false;
          }
          if(!gender){
            document.getElementById("genderError").innerHTML ="select a gender";
             isvalid=false;
          }
          if(hobbies.length==0){
            document.getElementById("hobbyError").innerHTML ="select atleast one hobby";
             isvalid=false;
            }
            if (isvalid){
                alert("Form submitted successfully!");
                
            }
            return isvalid;
            }
    </script>
</head>
<body>
    <form action="#" method="post" onsubmit="return submitForm()">
        <h1>Registration Form</h1>
        <div>
        <p>Name: <input type="text" name="name" id="name"></p>
        <span id="nameError" class="error-msg"> </span>
        </div>
        <div>
        <p>Email: <input type="email" name="email" id="email"></p>
        <span id="emailError" class="error-msg"></span>
        </div>
        <div>
        <p>Password: <input type="password" name="password" id="password"></p>
        <span id="passwordError" class="error-msg"></span>
        </div>
        <div>
        <p>City: <select name="city" id="city">
            <option value="default">--  Choose City --</option>
                <option value="new-york">New York</option>
                <option value="london">London</option>
                <option value="tokyo">Tokyo</option>
            </select>
        </p>
        <span id="cityError" class="error-msg"></span>
        </div>
        <div class="options-group">
        <h3>Select Gender</h3>
        <p>Male <input type="radio" name="gender" id="male" value="male"> </p>
        <p>Female <input type="radio" name="gender" id="Female" value="Female"></p>
        <p>Other <input type="radio" name="gender" id="Other" value="Other"></p>
        <span id="genderError" class="error-msg"></span>
        </div>
        <div>
        <p>Hobbies: </p>
       <p>Reading <input type="checkbox" name="hobby" id="" value="Reading"></p>
        <p>Sports <input type="checkbox" name="hobby" id="" value="Sports"></p>
         <p>Music <input type="checkbox" name="hobby" id="" value="Music"></p>
          <p>Coding<input type="checkbox" name="hobby" id="" value="Coding"></p>
          <span id="hobbyError" class="error-msg"></span>
          </div>
          <br>
          <input id="submit" type="submit">
    </form>
    
</body>
</html>
