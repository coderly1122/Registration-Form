<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form action="https://github.com/coderly1122/Registration-Form.git">
        <h1>Registration Form</h1>
        <p>Name: <input type="text" name="name" id=""></p>
        <p>Email: <input type="email" name="email" id=""></p>
        <p>Password: <input type="password" name="password" id=""></p>
        <p>City: <input type="text" name="city" id=""></p>
        <h3>Select Gender</h3>
        <p>Male <input type="radio" name="gender" id="male"> </p>
        <p>Female <input type="radio" name="gender" id=""></p>
        <p>Other <input type="radio" name="gender" id=""></p>
        
        <p>Hobbies: </p>
       <p>Reading <input type="checkbox" name="hobby" id=""></p>
        <p>Sports <input type="checkbox" name="hobby" id=""></p>
         <p>Music <input type="checkbox" name="hobby" id=""></p>
          <p>Coding<input type="checkbox" name="hobby" id=""></p>
          <br>
          <button type="submit">Submit</button>
    </form>
    
</body>
</html>
